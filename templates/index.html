<!DOCTYPE html>
<html>
<head>
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>More Downloader</title>

    <link href="/static/style.css" rel="stylesheet">
</head>

<body>

<div class="card">
    <h2>🚀 More Downloader</h2>

    <input id="url" onblur="loadPreview()" placeholder="Paste URL">

    <select id="mode">
        <option value="video">🎥 Video</option>
        <option value="audio">🎧 MP3</option>
    </select>

    <button id="downloadBtn" onclick="startDownload()">
        <span id="btnText">⬇ Start Download</span>
        <span id="btnLoader" class="btn-loader hidden"></span>
    </button>
 
    <div id="preview"></div>
    <div id="previewLoader" class="loader hidden"></div>

    <div id="progressBar">
        <div id="progress"></div>
    </div>

    <p id="stats"></p>
</div>

<div class="card">
    <h3>📜 Logs</h3>
    <pre id="log"></pre>
</div>

<div class="card">
    <h3>📂 History</h3>
    <ul id="history"></ul>
</div>

<script src="/static/app.js"></script>

<div id="toast" class="toast hidden"></div>
</body>
</html>
