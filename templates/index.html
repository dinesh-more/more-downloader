<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>More Downloader</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    padding: 15px;
}

.card {
    background: #1e293b;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 15px;
}

input, select {
    padding: 12px;
    width: 100%;
    border-radius: 8px;
    border: none;
    margin-bottom: 10px;
}

button {
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: #22c55e;
    color: white;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
}

button:hover {
    background: #16a34a;
}

#progressBar {
    width: 100%;
    background: #334155;
    border-radius: 10px;
    margin-top: 10px;
}

#progress {
    height: 20px;
    width: 0%;
    background: #22c55e;
    border-radius: 10px;
}

.thumbnail {
    width: 100%;
    max-width: 300px;
    border-radius: 10px;
    margin-top: 10px;
}

li {
    background: #0f172a;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="card">
<h2>🚀 More Downloader</h2>

<input id="url" placeholder="Paste URL" onblur="loadPreview()">

<select id="mode">
    <option value="video">🎥 Video</option>
    <option value="audio">🎧 MP3</option>
</select>

<button onclick="startDownload()">⬇ Start Download</button>

<div id="preview"></div>

<div id="progressBar">
    <div id="progress"></div>
</div>

<p id="stats"></p>
</div>

<div class="card">
<h3>📜 Logs</h3>
<pre id="log" style="height:200px;overflow:auto;"></pre>
</div>

<div class="card">
<h3>📂 History</h3>
<ul id="history"></ul>
</div>

<script>
function loadPreview() {
    const url = document.getElementById("url").value;
    if (!url) return;

    fetch(`/preview?url=${encodeURIComponent(url)}`)
    .then(res => res.json())
    .then(data => {
        if (data.thumbnail) {
            document.getElementById("preview").innerHTML =
                `<h4>${data.title}</h4>
                 <img src="${data.thumbnail}" class="thumbnail">`;
        }
    });
}

function startDownload() {
    const url = document.getElementById("url").value;
    const mode = document.getElementById("mode").value;

    const log = document.getElementById("log");
    log.innerText = "";

    const evtSource = new EventSource(`/download?url=${encodeURIComponent(url)}&mode=${mode}`);

    evtSource.onmessage = function(event) {
        const data = event.data;

        if (data.startsWith("PROGRESS:")) {
            const parts = data.replace("PROGRESS:", "").split("|");

            const percent = parts[0].replace("%","").trim();
            const size = parts[1];
            const speed = parts[2];

            document.getElementById("progress").style.width = percent + "%";
            document.getElementById("stats").innerText =
                `${percent}% | ${size} | ${speed}`;
        }
        else if (data.startsWith("LOG|")) {
            log.innerText += data.replace("LOG|","") + "\n";
        }
        else if (data === "DONE") {
            log.innerText += "\n✅ Done\n";
            evtSource.close();
            loadHistory();
        }
    };
}

function downloadFile(file) {
    window.open(`/download-file?file=${encodeURIComponent(file)}`, "_blank");
}

function loadHistory() {
    fetch("/history")
    .then(res => res.json())
    .then(data => {
        const list = document.getElementById("history");
        list.innerHTML = "";

        data.forEach(item => {
            const li = document.createElement("li");

            li.innerHTML = `
                <div><b>${item.file}</b></div>
                <div>${item.time} | ${item.size || ""}</div>
                <button onclick="downloadFile('${item.file}')">⬇ Download</button>
            `;

            list.appendChild(li);
        });
    });
}

loadHistory();
</script>

</body>
</html>
